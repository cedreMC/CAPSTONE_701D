<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Serviclemant</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Auth CSS -->
    <link rel="stylesheet" href="style/auth.css">
    <link rel="icon" href="img/logo2.png" type="image/png">
    
    <style>
        :root {
            --primary-cyan: #00BCD4;
            --primary-aqua: #4de18b;
            --secondary-cyan: #26C6DA;
            --dark-cyan: #0097A7;
            --light-aqua: #B2EBF2;
            --text-dark: #2C3E50;
            --text-light: #FFFFFF;
            --bg-light: #F8F9FA;
            --error-color: #dc3545;
            --success-color: #28a745;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--primary-aqua) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.1;
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
        }

        .form-container {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-aqua));
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .auth-title {
            color: var(--text-dark);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-label {
            display: flex;
            align-items: center;
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .form-label i {
            color: var(--primary-cyan);
            margin-right: 8px;
            font-size: 1rem;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-cyan);
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.1);
            background: #ffffff;
            transform: translateY(-2px);
        }

        .form-input:hover {
            border-color: var(--secondary-cyan);
            background: #ffffff;
        }

        .form-input.error {
            border-color: var(--error-color);
            background: #fff5f5;
        }

        .form-input.success {
            border-color: var(--success-color);
            background: #f8fff8;
        }

        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-aqua));
            border: none;
            border-radius: 12px;
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.3);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 188, 212, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit.loading {
            pointer-events: none;
        }

        .btn-submit.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.show {
            display: block;
        }

        .auth-error {
            background: #fff5f5;
            color: var(--error-color);
            border: 1px solid #ffcccc;
        }

        .auth-success {
            background: #f0fff4;
            color: var(--success-color);
            border: 1px solid #c3e6cb;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e9ecef;
        }

        .back-link a {
            color: var(--primary-cyan);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link a:hover {
            color: var(--dark-cyan);
        }

        .back-link a i {
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .form-container {
                padding: 30px 24px;
            }

            .auth-title {
                font-size: 1.5rem;
            }

            .auth-icon {
                width: 70px;
                height: 70px;
                font-size: 1.75rem;
            }
        }

        /* Input con icono */
        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-input:focus ~ .input-icon {
            color: var(--primary-cyan);
        }
    </style>
    <!-- Global Loading System -->
    <link rel="stylesheet" href="style/loading.css">
    <script src="../js/global-loading.js"></script>
</head>

<body>
    <div class="auth-container">
        <div class="form-container">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-key"></i>
                </div>
                <h2 class="auth-title">Recuperar Contraseña</h2>
                <p class="auth-subtitle">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
            </div>

            <div id="generalError" class="message auth-error"></div>
            <div id="generalSuccess" class="message auth-success"></div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i>
                        Correo Electrónico
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="ejemplo@correo.com"
                            required
                            autocomplete="email"
                        >
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                    <div class="error-message" id="emailError" style="display: none; color: var(--error-color); font-size: 0.85rem; margin-top: 6px;"></div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-paper-plane me-2"></i>
                    Enviar Enlace de Recuperación
                </button>
            </form>

            <div class="back-link">
                <a href="login.html">
                    <i class="fas fa-arrow-left"></i>
                    Volver al inicio de sesión
                </a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgotForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const generalError = document.getElementById('generalError');
        const generalSuccess = document.getElementById('generalSuccess');
        const submitBtn = document.getElementById('submitBtn');

        // Validación en tiempo real
        emailInput.addEventListener('input', function() {
            validateEmail();
        });

        emailInput.addEventListener('blur', function() {
            validateEmail();
        });

        function validateEmail() {
            const email = emailInput.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === '') {
                showFieldError('emailError', 'El correo electrónico es requerido');
                emailInput.classList.add('error');
                emailInput.classList.remove('success');
                return false;
            } else if (!emailRegex.test(email)) {
                showFieldError('emailError', 'Ingresa un correo electrónico válido');
                emailInput.classList.add('error');
                emailInput.classList.remove('success');
                return false;
            } else {
                hideFieldError('emailError');
                emailInput.classList.remove('error');
                emailInput.classList.add('success');
                return true;
            }
        }

        function showFieldError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }
        }

        function hideFieldError(elementId) {
            const errorElement = document.getElementById(elementId);
            if (errorElement) {
                errorElement.style.display = 'none';
            }
        }

        function showMessage(element, message, isError = false) {
            element.textContent = message;
            element.classList.add('show');
            element.classList.remove('auth-success', 'auth-error');
            element.classList.add(isError ? 'auth-error' : 'auth-success');
            
            // Ocultar el otro mensaje
            if (isError) {
                generalSuccess.classList.remove('show');
            } else {
                generalError.classList.remove('show');
            }
        }

        function hideMessages() {
            generalError.classList.remove('show');
            generalSuccess.classList.remove('show');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Limpiar mensajes anteriores
            hideMessages();
            hideFieldError('emailError');

            // Validar email
            if (!validateEmail()) {
                return;
            }

            const email = emailInput.value.trim();
            const originalBtnText = submitBtn.innerHTML;

            // Mostrar estado de carga
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Enviando...';

            try {
                const res = await fetch('http://localhost:3000/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (data.success) {
                    showMessage(generalSuccess, data.message || '¡Enlace enviado! Revisa tu correo electrónico.', false);
                    emailInput.classList.add('success');
                    emailInput.disabled = true;

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 3000);
                } else {
                    showMessage(generalError, data.message || 'Error al enviar el enlace. Intenta nuevamente.', true);
                    emailInput.classList.add('error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage(generalError, 'Error de conexión. Verifica tu internet e intenta nuevamente.', true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = originalBtnText;
            }
        });
    </script>
</body>
</html>
