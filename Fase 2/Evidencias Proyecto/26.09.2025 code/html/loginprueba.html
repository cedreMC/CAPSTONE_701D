<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Test</title>
</head>
<body>
  <h2>Login Básico</h2>

  <form id="loginForm">
    <label>Email:</label>
    <input type="text" id="email"><br><br>

    <label>Contraseña:</label>
    <input type="password" id="contraseña"><br><br>

    <button type="submit">Iniciar Sesión</button>
  </form>

  <pre id="resultado"></pre>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const contraseña = document.getElementById("contraseña").value.trim();

      try {
        const res = await fetch("http://localhost:3000/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, contraseña })
        });

        const text = await res.text(); // leer como texto por si no es JSON válido
        document.getElementById("resultado").textContent = text;
      } catch (err) {
        document.getElementById("resultado").textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
