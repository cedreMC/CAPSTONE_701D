<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Servicio - Serviclemant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
    .request-section { padding: 60px 0; }
    .request-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    .btn-submit { width: 100%; padding: 15px; background: linear-gradient(135deg, #00BCD4, #4de18b); border: none; border-radius: 12px; color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
    .btn-submit:hover { background: linear-gradient(135deg, #0097A7, #26C6DA); }
    .error-message { color: red; font-size: 0.85rem; margin-top: 5px; display: none; }
  </style>
</head>
<body>
  <section class="request-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="request-card">
            <h2 class="text-center mb-3"><i class="fas fa-clipboard-list me-2"></i>Solicitar Servicio</h2>
            <p class="text-center text-muted mb-4">Completa el formulario y nos pondremos en contacto contigo</p>
            
            <form id="serviceRequestForm" novalidate>
              <div class="row">
                <div class="col-md-6">
                  <label for="fullName" class="form-label"><i class="fas fa-user me-2"></i>Nombre Completo</label>
                  <input type="text" id="fullName" name="fullName" class="form-control" required>
                  <div class="error-message" id="fullNameError"></div>
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label"><i class="fas fa-envelope me-2"></i>Correo Electrónico</label>
                  <input type="email" id="email" name="email" class="form-control" required>
                  <div class="error-message" id="emailError"></div>
                </div>
              </div>

              <div class="row mt-3">
                <div class="col-md-6">
                  <label for="phone" class="form-label"><i class="fas fa-phone me-2"></i>Teléfono</label>
                  <input type="tel" id="phone" name="phone" class="form-control" required>
                  <div class="error-message" id="phoneError"></div>
                </div>
                <div class="col-md-6">
                  <label for="service" class="form-label"><i class="fas fa-broom me-2"></i>Servicio Solicitado</label>
                  <select id="service" name="service" class="form-select" required>
                    <option value="">Selecciona un servicio</option>
                    <option value="Limpieza Residencial">Limpieza Residencial</option>
                    <option value="Limpieza Comercial">Limpieza Comercial</option>
                    <option value="Limpieza Industrial">Limpieza Industrial</option>
                    <option value="Limpieza Post-Obra">Limpieza Post-Obra</option>
                  </select>
                  <div class="error-message" id="serviceError"></div>
                </div>
              </div>

              <div class="mt-3">
                <label for="message" class="form-label"><i class="fas fa-comment me-2"></i>Mensaje Adicional</label>
                <textarea id="message" name="message" class="form-control" rows="4"></textarea>
                <div class="error-message" id="messageError"></div>
              </div>

              <button type="submit" class="btn-submit mt-4"><i class="fas fa-paper-plane me-2"></i>Enviar Solicitud</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    document.getElementById('serviceRequestForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const service = document.getElementById('service').value;
      const message = document.getElementById('message').value.trim();

      const solicitud = { nombre: fullName, correo: email, telefono: phone, servicio: service, mensaje: message };

      fetch('http://localhost:3000/solicitar-servicio', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(solicitud)
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("✅ Solicitud enviada con éxito.");
          document.getElementById('serviceRequestForm').reset();
        } else {
          alert("❌ Error: " + data.message);
        }
      })
      .catch(err => {
        console.error("Error en fetch:", err);
        alert("⚠️ No se pudo conectar con el servidor.");
      });
    });
  </script>
</body>
</html>
